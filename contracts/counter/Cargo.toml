[package]
name = "counter"
description = "Keyhole sandbox smoke-test contract: increment; reset (exactly 1 yoctoNEAR); transfer_ownership (owner only)"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# No dev-dependencies: the contract is exercised live by test-sandbox/counter.sandbox.test.ts, and nothing here
# pulls a sandbox or near-workspaces into this crate's target dir.
[dependencies]
near-sdk = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
